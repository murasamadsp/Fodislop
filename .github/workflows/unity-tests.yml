name: Unity EditMode Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode-tests:
    name: EditMode tests (Unity ${{ vars.UNITY_VERSION || '6000.5.0f1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Требуется активация Unity-лицензии. Secrets: UNITY_LICENSE, UNITY_EMAIL,
      # UNITY_PASSWORD (и UNITY_SERIAL при необходимости).
      - uses: game-ci/unity-license-activate@v3
        with:
          unityVersion: ${{ vars.UNITY_VERSION || '6000.5.0f1' }}

      # Жёсткий гейт: любой провал EditMode-тестов роняет job.
      # Предсуществующие падения починены: фикстура StatusProcessorTests получила
      # стаб INetworkService, GPU-тесты ContactOcclusion скипаются без compute
      # shaders, McpUnity-тесты становятся inconclusive в batch mode (Assume).
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: .
          unityVersion: ${{ vars.UNITY_VERSION || '6000.5.0f1' }}
          testMode: EditMode
          artifactsPath: artifacts/editmode
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: editmode-test-results
          path: artifacts/editmode
          retention-days: 7
