name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Assets/Scripts/**'
      - 'Assets/Editor/**'
      - 'Assets/Resources/**'
      - 'Packages/manifest.json'
      - 'Packages/packages-lock.json'
      - 'scripts/pre-commit-lint.sh'
      - '*.csproj'
  pull_request:
    branches: [main]
    paths:
      - 'Assets/Scripts/**'
      - 'Assets/Editor/**'
      - 'Assets/Resources/**'
      - 'Packages/manifest.json'
      - 'Packages/packages-lock.json'
      - 'scripts/pre-commit-lint.sh'
      - '*.csproj'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: C# Build & Roslyn Analyzers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/packages-lock.json') }}
          restore-keys: nuget-

      - name: Build dependencies
        run: |
          for csproj in Effekseer*.csproj UniTask*.csproj McpUnity*.csproj; do
            [ -f "$csproj" ] && dotnet build "$csproj" -clp:NoSummary --nologo 2>/dev/null || true
          done

      - name: Build & analyze
        id: lint
        run: |
          chmod +x scripts/pre-commit-lint.sh
          ./scripts/pre-commit-lint.sh 2>&1 | tee /tmp/lint.log
        continue-on-error: true

      - name: Upload log on failure
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/lint.log
          retention-days: 7

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
